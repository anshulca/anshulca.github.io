plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

android {
    namespace 'com.studyfromnotes.dhun'
    compileSdk 34

    defaultConfig {
        applicationId "com.studyfromnotes.dhun"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        // TWA host and Digital Asset Links
        manifestPlaceholders = [
            hostName       : "jap.studyfromnotes.com",
            defaultUrl     : "https://jap.studyfromnotes.com",
            launcherName   : "Dhun",
            assetStatements: '[{ "relation": ["delegate_permission/common.handle_all_urls"],' +
                             '   "target": { "namespace": "web", "site": "https://jap.studyfromnotes.com" } }]'
        ]
    }

    signingConfigs {
        release {
            // TODO: Replace with your keystore path and credentials
            // storeFile file('dhun-release.jks')
            // storePassword 'YOUR_STORE_PASSWORD'
            // keyAlias 'dhun'
            // keyPassword 'YOUR_KEY_PASSWORD'
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // signingConfig signingConfigs.release  // Uncomment after keystore setup
        }
        debug {
            applicationIdSuffix ".debug"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // TWA - Trusted Web Activity
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'

    // Firebase
    implementation platform('com.google.firebase:firebase-bom:33.1.2')
    implementation 'com.google.firebase:firebase-messaging'
    implementation 'com.google.firebase:firebase-analytics'

    // AndroidX
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.work:work-runtime:2.9.1'
}
